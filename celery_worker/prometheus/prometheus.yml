global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kafka_consumer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['kafka_consumer:8003']

  - job_name: 'celery_worker'
    static_configs:
      - targets: ['celery_worker:8004']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'kafka_exporter'
    static_configs:
      - targets: ['kafka_exporter:9308']
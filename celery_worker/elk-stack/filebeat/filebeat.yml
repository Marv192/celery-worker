filebeat.inputs:
  - type: filestream
    id: celery_worker-logs-input
    paths:
      - '/var/lib/docker/containers/*/*-json.log'

    prospector:
      scanner:
        fingerprint.length: 64
        fingerprint.offset: 0

    processors:
      - add_docker_metadata: ~
      - drop_event:
          when:
            not:
              or:
                - equals:
                    container.name: "celery_worker"
                - equals:
                    container.name: "kafka_consumer"

    json.keys_under_root: true
    json.add_error_key: true
    json.message_key: log
    json.overwrite_keys: true

    scan_frequency: 5s
    harvester_limit: 5

output.logstash:
  hosts: ["logstash_celery:5044"]

logging.level: info
services:
  celery_worker:
    build: ./celery_worker
    image: marketplace_celery_worker
    container_name: celery_worker
    restart: unless-stopped
    command: 'celery -A app.celery_app worker --pool=solo --beat --loglevel=info'
    env_file:
      - .env
    ports:
      - "8004:8004"
    networks:
      - backend_network
    volumes:
      - ./celery_worker:/celery_worker

  celery_beat:
    build: ./celery_worker
    container_name: celery_beat
    command: 'celery -A app.celery_app beat --loglevel=info'
    env_file:
      - .env
    networks:
      - backend_network
    depends_on:
      - redis_celery_worker
    volumes:
      - ./celery_worker:/celery_worker

  kafka_consumer:
    build: ./celery_worker
    image: marketplace_celery_worker
    container_name: kafka_consumer
    restart: unless-stopped
    command: python -m app.main
    env_file:
      - .env
    ports:
      - "8003:8003"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis_celery_worker:
        condition: service_started
    networks:
      - backend_network
    volumes:
      - ./celery_worker:/celery_worker

  redis_celery_worker:
    image: redis:7-alpine
    container_name: redis_celery
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 16mb

    volumes:
      - redis_data_celery:/data
    networks:
      - backend_network

  kafka:
    image: apache/kafka:4.0.2
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "rH_oBkeySo2gzDpF1PZGwA"
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_NODE_ID: "1"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_BROKER_ID: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_LOG_RETENTION_HOURS: "12"
      KAFKA_MESSAGE_MAX_BYTES: "1048576"

    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092' 2>/dev/null" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - backend_network

  kafka-init:
    image: apache/kafka:4.0.2
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists
      --topic ORDER_CREATED
      --bootstrap-server kafka:29092
      --partitions 3
      --replication-factor 1
      --config retention.ms=43200000;
      echo "Kafka initialization complete, created topics:";
      /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:29092;'
    networks:
      - backend_network

  mock-orders:
    image: mendhak/http-https-echo:latest
    container_name: mock-orders
    networks:
      - backend_network

  prometheus_celery:
    image: prom/prometheus:v3.11.3
    container_name: prometheus_celery
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./celery_worker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend_network
    depends_on:
      - celery_worker

  grafana_celery:
    image: grafana/grafana:13.0.1
    container_name: grafana_celery
    restart: unless-stopped
    environment:
      - GF_LOG_LEVEL=debug
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./celery_worker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./celery_worker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./celery_worker/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - backend_network
    depends_on:
      - prometheus_celery

  node_exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node_exporter
    command:
      - '--path.rootfs=/rootfs'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - backend_network

  kafka_exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka_exporter
    command:
      - --kafka.server=kafka:29092
    ports:
      - "9308:9308"
    restart: unless-stopped
    networks:
      - backend_network


volumes:
  redis_data_celery:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  backend_network:
    driver: bridge